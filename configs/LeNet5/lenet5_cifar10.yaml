# LeNet-5 Configuration for CIFAR-10 Dataset
# Adapted from "Gradient-Based Learning Applied to Document Recognition" (LeCun et al., 1998)

# Device and workers
device: "cuda"
num_workers: 4

# Dataset configuration
dataset:
  type: "CIFAR10"
  root: "./data/cifar10"
  download: true

  # No subset - use full CIFAR-10 dataset
  class_subset: null
  sample_subset: null

  # CIFAR-10 transforms (32x32 RGB images)
  train_transforms:
    preset: "cifar10_augmented"
    override:
      RandomCrop:
        height: 28
        width: 28
  test_transforms:
    preset: "cifar10_basic"
      additional:
        RandomCrop:
          height: 28
          width: 28
        ToTensorV2

# Model configuration
model:
  type: "LeNet5"
  in_channels: 3        # CIFAR-10 is RGB
  out_classes: 10       # 10 classes

# Training hyperparameters
batch_size: 128
epochs: 100

# Optimizer configuration
optimizer:
  type: "SGD"
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005

# Criterion
criterion:
  type: "CrossEntropyLoss"

# Learning rate scheduler with warmup
scheduler_list:
  - type: "LinearLR"
    start_factor: 0.1
    total_iters: 5
  - type: "MultiStepLR"
    milestones: [50, 75]
    gamma: 0.1

milestones: [5]

# File save/logs settings
run_dir: "runs/lenet5_cifar10"
tb_dir: "tb-output/lenet5_cifar10"
max_keep: 3
