# ResNet-152 Configuration for ImageNet
# Based on "Deep Residual Learning for Image Recognition" (He et al., 2015)
#
# ResNet-152 is the deepest variant from the paper
# This configuration:
# - Follows the paper's ImageNet protocol
# - Uses lower initial learning rate (0.05 instead of 0.1) for stability
# - Requires significant GPU memory (reduce batch_size if needed)

# Config specific
device: "cuda"
num_workers: 16

# Dataset configuration
dataset:
  type: "ImageNet"
  root: "./data/imagenet"
  download: false

  train_transforms: "imagenet_augmented"
  test_transforms: "imagenet_basic"

# Model configuration
model:
  type: "ResNet152"
  in_channels: 3
  num_classes: 1000

# Hyperparameters
batch_size: 128         # Lower batch size due to model size
epochs: 90

# Optimizer configuration
optimizer:
  type: "SGD"
  lr: 0.05              # Lower initial LR for very deep networks
  momentum: 0.9
  weight_decay: 0.0001

# Criterion
criterion:
  type: "CrossEntropyLoss"

# Learning rate scheduler
scheduler_list:
  - type: "MultiStepLR"
    milestones: [30, 60, 80]
    gamma: 0.1
milestones: []

# File save/logs settings
run_dir: "runs/resnet152_imagenet"
tb_dir: "tb-output/resnet152_imagenet"
max_keep: 5
